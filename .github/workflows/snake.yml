# GitHub Action for generating an animated snake eating your contributions graph
name: Generate Snake Animation

# Controls when the action will run
on:
  schedule:
      # Runs every 12 hours
    - cron: "0 */12 * * *"  # Fixed the cron syntax
  
  # Allows manual triggering from the Actions tab
  workflow_dispatch:
  
  # Also runs on every push to the main branch
  push:
    branches:
      - main

# Job sequence definition
jobs:
  build:
    name: Generate Snake Animation
    runs-on: ubuntu-latest
    
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Ensures full history for accurate contribution data
    
      # Generate snake animation files
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          # Generate multiple output formats with different styling options
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=green&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
            dist/ocean.gif?color_snake=blue&color_dots=#93c0fe,#638ce0,#4259c3,#2e3599,#161866
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Show build status for debugging purposes
      - name: Display build status
        run: |
          echo "Snake animation files generated successfully!"
          git status
      
      # Deploy the generated files to the output branch
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "🐍 Update snake animation files"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
